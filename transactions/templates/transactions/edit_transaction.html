{% extends "accounts/base.html" %}

{% block title %}Edit transaction | FinSight{% endblock %}

{% block content %}
    <h1>Edit transaction</h1>
    <form method="post">
        {% csrf_token %}
        <p>
            <label for="id_date">Date</label>
            <input id="id_date" name="date" type="date" value="{{ transaction.date|date:'Y-m-d' }}" required>
        </p>
        <p>
            <label for="id_type">Type</label>
            <select id="id_type" name="type" required>
                <option value="income"{% if transaction.type == "income" %} selected{% endif %}>Income</option>
                <option value="expense"{% if transaction.type == "expense" %} selected{% endif %}>Expense</option>
                <option value="transfer"{% if transaction.type == "transfer" %} selected{% endif %}>Transfer</option>
                <option value="adjustment"{% if transaction.type == "adjustment" %} selected{% endif %}>Adjustment</option>
            </select>
        </p>
        <p>
            <label for="id_amount">Amount</label>
            <input id="id_amount" name="amount" type="number" step="0.01" value="{{ transaction.amount }}" required>
        </p>
        <p>
            <label for="id_description">Description</label>
            <input id="id_description" name="description" type="text" maxlength="255" value="{{ transaction.description }}" required>
        </p>
        <p>
            <label for="id_category">Category</label>
            <input id="id_category" name="category" type="text" maxlength="100" value="{{ transaction.category|default_if_none:'' }}">
        </p>
        <button type="submit">Save changes</button>
        <a href="{% url 'transactions:transaction_detail' transaction.pk %}">Cancel</a>
    </form>
{% endblock %}
