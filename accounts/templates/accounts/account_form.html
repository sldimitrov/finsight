{% extends "accounts/base.html" %}

{% block title %}{{ title }} | FinSight{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save account</button>
        <a href="{% if account %}{% url 'accounts:detail' account.pk %}{% else %}{% url 'accounts:index' %}{% endif %}">Cancel</a>
    </form>
{% endblock %}
